[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carrotquant"
version = "0.1.0"
description = "High-performance 1m+ Numba event-driven quantitative backtesting engine for A-share full-market trading"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numba>=0.60.0",
    "numpy>=1.26.0,<2.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["carrotquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

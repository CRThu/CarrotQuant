[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carrotquant"
version = "1.0.0"
description = "CarrotQuant: High-performance, full-stack quantitative trading, data pipeline and backtesting framework"
readme = "README.md"
authors = [
    { name = "Carrot", email = "11172391+CRThu@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = [
    "carrotquant-engine>=1.1.0",
    "carrotquant-data>=1.3.0",
]

[project.optional-dependencies]
engine = [
    "carrotquant-engine>=1.1.0",
]
data = [
    "carrotquant-data>=1.3.0",
]
all = [
    "carrotquant-engine>=1.1.0",
    "carrotquant-data>=1.3.0",
]
dev = [
    "bump-my-version>=1.0.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/CRThu/carrotquant"
Repository = "https://github.com/CRThu/carrotquant.git"
"Engine Repo" = "https://github.com/CRThu/carrotquant-engine"
"Data Repo" = "https://github.com/CRThu/carrotquant-data"

[project.scripts]
cqdata = "cq.data.entrypoints.cli:app"

[tool.bumpversion]
current_version = "1.0.0"
commit = true
tag = true
allow_dirty = true
tag_name = "v{new_version}"
message = "chore(release): bump version {current_version} → {new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "carrotquant/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
carrotquant-engine = { path = "../carrotquant-engine", editable = true }
carrotquant-data = { path = "../carrotquant-data", editable = true }

